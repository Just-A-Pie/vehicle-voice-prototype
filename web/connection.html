<!doctype html><html lang="zh"><meta charset="utf-8"><title>座舱连接设置</title><style>body{background:#11191e;color:#e2ecef;font:16px/1.7 system-ui;max-width:660px;margin:60px auto;padding:24px}label{display:block;margin:18px 0}input,select,button{box-sizing:border-box;width:100%;padding:12px;background:#243139;color:inherit;border:1px solid #52636c;border-radius:8px;font:inherit}button{cursor:pointer;background:#345a52}small,p{color:#aabbc4}#result{white-space:pre-wrap}</style><h1>连接设置</h1><p>切换前请结束录音并等待回复完成。切换后刷新座舱页面，会建立新会话。</p><form id="form"><label>语音服务<select id="profile"><option value="local">本机模型</option><option value="api">外部 API · 百炼</option><option value="server">GPU 服务器 · 原服务</option><option value="checkpoint48">GPU 服务器 · 新训练车载 checkpoint-48</option><option value="server3b">GPU 服务器 · 2.5-Omni 3B 测试</option></select></label><fieldset id="api"><legend>百炼参数</legend><label>服务地址<input id="base_url" type="url"></label><input id="model" type="hidden"><label>实时 Omni 模型（负责理解与语音回复）<input id="speech_model"></label><label>音色<input id="voice"></label><small id="key"></small><p>密钥沿用本机安全文件，不在浏览器显示。仅支持已接入的百炼 Omni 协议；填写其他厂商地址不能直接使用。不会开通付费或自动回退。历史免费额度曾耗尽，需确认额度后再演示。</p></fieldset><button>保存并切换</button></form><p id="result" role="status"></p><a href="/slai/" style="color:#a7d9ca">返回座舱（重新建立会话）</a><script>
const ids=['base_url','model','speech_model','voice'];const el=id=>document.getElementById(id);el('profile').onchange=()=>el('api').hidden=el('profile').value!=='api';fetch('/api/connection-settings').then(r=>r.json()).then(d=>{el('profile').value=d.profile;ids.forEach(k=>el(k).value=d.settings[k]);el('key').textContent=d.key_configured?'已找到本机密钥文件':'未找到密钥文件，请配置 runtime/dashscope.key';el('profile').onchange()}).catch(()=>el('result').textContent='无法读取配置');el('form').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const r=await fetch('/api/connection-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:el('profile').value,settings:Object.fromEntries(ids.map(k=>[k,el(k).value]))})});const d=await r.json();el('result').textContent=d.message||d.detail}catch{el('result').textContent='保存失败，请检查本机服务'}finally{b.disabled=false}};
</script></html>

async_chunk: true
connectors:
  streaming_shm:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
stages:
  - stage_id: 0
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    max_model_len: 32768
    gpu_memory_utilization: 0.8
    enforce_eager: true
    enable_prefix_caching: false
    mm_processor_cache_gb: 0
    trust_remote_code: true
    devices: "0"
    output_connectors:
      to_stage_1: streaming_shm
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1024
  - stage_id: 1
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    gpu_memory_utilization: 0.8
    enforce_eager: false
    enable_prefix_caching: false
    trust_remote_code: true
    devices: "1"
    engine_extras:
      attention_backend: FLASHINFER
    input_connectors:
      from_stage_0: streaming_shm
    output_connectors:
      to_stage_2: streaming_shm
    default_sampling_params:
      temperature: 0.9
      top_p: 0.8
      top_k: 40
      repetition_penalty: 1.05
      max_tokens: 2048
  - stage_id: 2
    max_num_batched_tokens: 32768
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: true
    enable_prefix_caching: false
    enable_flashinfer_autotune: false
    async_scheduling: true
    trust_remote_code: true
    devices: "0"
    input_connectors:
      from_stage_1: streaming_shm
